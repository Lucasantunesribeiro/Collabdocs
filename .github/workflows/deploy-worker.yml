# Deploy do Cloudflare Worker (WebSocket/presença) no plano gratuito.
# Somente manual e nunca em pull_request.
#
# Pré-requisitos (Settings > Secrets and variables > Actions):
#   secrets.CLOUDFLARE_API_TOKEN   token com permissão "Edit Cloudflare Workers"
#   secrets.CLOUDFLARE_ACCOUNT_ID  id da conta Cloudflare
#   vars.DOCUMENTS_API_URL         ex.: https://collabdocs-dotnet-api.onrender.com/api
#   vars.ALLOWED_ORIGINS           ex.: https://collabdocs-app.vercel.app
# O NEXTAUTH_SECRET do Worker é um secret do próprio Cloudflare, definido uma vez:
#   npx wrangler secret put NEXTAUTH_SECRET
name: Deploy Worker (Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Typecheck e testes do Worker
        run: npm run typecheck:workers && npm test
      - name: Verificar configuração
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOCS_API: ${{ vars.DOCUMENTS_API_URL }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::defina o secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$DOCS_API" ] || { echo "::error::defina a variável DOCUMENTS_API_URL (sem ela o WebSocket nega documentos da API .NET)"; exit 1; }
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy
          --var "DOCUMENTS_API_URL:${{ vars.DOCUMENTS_API_URL }}"
          --var "ALLOWED_ORIGINS:${{ vars.ALLOWED_ORIGINS || 'https://collabdocs-app.vercel.app' }}"
